<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Friendly bulldog illustration">
  <title>Friendly bulldog illustration</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" rx="12"/>
  <!-- Body -->
  <ellipse cx="240" cy="210" rx="120" ry="80" fill="#d6a77a" stroke="#8d5a3c" stroke-width="4"/>
  <!-- Head -->
  <circle cx="240" cy="130" r="70" fill="#d6a77a" stroke="#8d5a3c" stroke-width="4"/>
  <!-- Ears -->
  <path d="M190 95 q-20 -20 -40 0 q10 40 40 20" fill="#8d5a3c"/>
  <path d="M290 95 q20 -20 40 0 q-10 40 -40 20" fill="#8d5a3c"/>
  <!-- Eyes -->
  <circle cx="220" cy="120" r="8" fill="#2b2b2b"/>
  <circle cx="260" cy="120" r="8" fill="#2b2b2b"/>
  <!-- Nose & muzzle -->
  <ellipse cx="240" cy="145" rx="24" ry="16" fill="#2b2b2b"/>
  <path d="M220 155 q20 12 40 0" stroke="#8d5a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wrinkles -->
  <path d="M200 130 q20 10 40 0" stroke="#8d5a3c" stroke-width="2" fill="none"/>
  <path d="M260 130 q20 10 40 0" stroke="#8d5a3c" stroke-width="2" fill="none"/>
  <!-- Tongue -->
  <path d="M240 160 q0 16 12 20 q-10 6 -24 0 q12 -4 12 -20" fill="#ff7b9c"/>
  <!-- Collar -->
  <rect x="180" y="195" width="120" height="18" rx="6" fill="#bb1333"/>
  <circle cx="240" cy="204" r="6" fill="#ffd24d"/>
</svg>
