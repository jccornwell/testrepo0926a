<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Semi-realistic bulldog illustration">
  <title>Semi-realistic bulldog illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e6eef6"/>
    </linearGradient>
    <radialGradient id="furLight" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#f6e6d8"/>
      <stop offset="100%" stop-color="#d6b692"/>
    </radialGradient>
    <linearGradient id="furShade" x1="0" x2="0">
      <stop offset="0%" stop-color="#d6b692"/>
      <stop offset="100%" stop-color="#8d5a3c"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Ground shadow -->
  <ellipse cx="320" cy="390" rx="200" ry="30" fill="#000" opacity="0.06" filter="url(#softShadow)"/>

  <!-- Rear body -->
  <path d="M120 300 C140 230, 220 200, 320 220 C420 240, 480 280, 520 330 C460 360, 380 380, 320 370 C260 360, 200 340, 120 300 Z" fill="url(#furLight)" stroke="#7a4f34" stroke-width="2"/>

  <!-- Torso shading -->
  <path d="M140 300 C220 250, 300 240, 380 260 C420 275, 460 300, 500 340" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="18" stroke-linecap="round"/>

  <!-- Front chest -->
  <path d="M260 250 C280 210, 360 200, 420 220 C430 260, 400 300, 360 310 C320 320, 280 310, 260 280 Z" fill="#fff" opacity="0.95"/>

  <!-- Head base -->
  <g transform="translate(120,40)">
    <ellipse cx="200" cy="160" rx="110" ry="95" fill="url(#furLight)" stroke="#7a4f34" stroke-width="3"/>

    <!-- Jowls -->
    <path d="M110 160 C120 210, 170 240, 210 240 C250 240, 300 210, 310 160 C290 180, 250 200, 210 200 C170 200, 130 180, 110 160 Z" fill="#e9d7c4" stroke="#7a4f34" stroke-width="2"/>

    <!-- Muzzle -->
    <ellipse cx="200" cy="160" rx="56" ry="42" fill="#c7b09a" stroke="#6b4630" stroke-width="2"/>

    <!-- Nose -->
    <path d="M184 150 C188 138, 216 138, 220 150 C216 154, 188 154, 184 150 Z" fill="#262626"/>
    <ellipse cx="200" cy="154" rx="6" ry="4" fill="#fff" opacity="0.7"/>

    <!-- Mouth crease and wrinkles -->
    <path d="M160 170 C188 180, 212 180, 240 170" stroke="#6b4630" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M150 140 C170 150, 190 152, 210 140" stroke="#6b4630" stroke-width="2" fill="none"/>
    <path d="M260 140 C280 150, 300 156, 320 142" stroke="#6b4630" stroke-width="2" fill="none"/>

    <!-- Eyes with lids -->
    <g>
      <ellipse cx="165" cy="140" rx="16" ry="12" fill="#fff"/>
      <circle cx="165" cy="140" r="6" fill="#2a2a2a"/>
      <ellipse cx="235" cy="140" rx="16" ry="12" fill="#fff"/>
      <circle cx="235" cy="140" r="6" fill="#2a2a2a"/>
      <path d="M150 132 C158 126, 172 122, 182 128" stroke="#7a4f34" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M220 128 C232 122, 246 126, 254 132" stroke="#7a4f34" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Ears -->
    <path d="M115 90 C120 60, 160 60, 170 100 C150 90, 130 100, 115 90 Z" fill="#7a4f34" stroke="#5b3b26" stroke-width="1.5"/>
    <path d="M310 88 C300 58, 260 60, 250 98 C270 88, 290 100, 310 88 Z" fill="#7a4f34" stroke="#5b3b26" stroke-width="1.5"/>

    <!-- Tongue -->
    <path d="M196 190 C200 200, 220 206, 228 196 C226 204, 208 210, 196 190 Z" fill="#ff7b9c"/>

    <!-- Highlights and shading -->
    <ellipse cx="200" cy="120" rx="72" ry="20" fill="rgba(255,255,255,0.25)"/>
    <path d="M120 200 C150 230, 200 250, 260 245" stroke="rgba(0,0,0,0.06)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Collar -->
  <g>
    <rect x="240" y="330" width="160" height="18" rx="8" fill="#b2182b"/>
    <circle cx="320" cy="339" r="8" fill="#ffd54f"/>
  </g>

</svg>
